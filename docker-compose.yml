services:
  appsec-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: appsec_auth_gateway
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - HOST=0.0.0.0
      - MONGODB_URI=mongodb://mongodb:27017/appsec_gateway_db
      - BCRYPT_SALT_ROUNDS=12
      - JWT_ACCESS_SECRET=prod_super_secret_jwt_access_key_min_32_chars_long!
      - JWT_REFRESH_SECRET=prod_super_secret_jwt_refresh_key_min_32_chars_long!
      - JWT_ACCESS_EXPIRATION=15m
      - JWT_REFRESH_EXPIRATION_DAYS=7
      - COOKIE_SECRET=prod_super_secret_cookie_signing_key_32_chars!
      - GATEWAY_API_KEY=prod_gateway_api_key_secure_baseline_token_123456
      - CORS_ALLOWED_ORIGINS=http://localhost:3000,http://localhost:5173
      - RATE_LIMIT_GLOBAL_WINDOW_MS=900000
      - RATE_LIMIT_GLOBAL_MAX=100
      - RATE_LIMIT_AUTH_WINDOW_MS=900000
      - RATE_LIMIT_AUTH_MAX=5
      - BODY_LIMIT=10kb
      - LOG_LEVEL=info
    depends_on:
      mongodb:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    networks:
      - appsec_internal_network

  mongodb:
    image: mongo:7.0
    container_name: appsec_mongodb
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017" # Bind to loopback only for defense against direct external exposure
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - appsec_internal_network

volumes:
  mongodb_data:
    driver: local

networks:
  appsec_internal_network:
    driver: bridge
